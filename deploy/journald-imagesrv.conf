# ImageSrv -- a ceiling on the system journal (#1737).
#
# Installed as /etc/systemd/journald.conf.d/90-imagesrv.conf by
# deploy/setup-boot-server.sh (new servers) and tools/server-upgrade.sh
# (servers already in the field). The images, the database and the journal
# share one partition (measured on the lab server TA, 18/10: /dev/sda2, 786G,
# journald at 403M with no ceiling of its own -- the systemd default is 10%
# of the partition, up to 4G).
#
# SystemMaxUse   1G     -- the journal never grows past this.
# SystemKeepFree 4G     -- journald stops writing below 4G free (the systemd
#                          default, stated here because server/storage/disk_reserve.py
#                          counts on it: SYSTEM_RESERVE_BYTES keeps 10 GiB free
#                          for the system, and these 4G + 1G are part of it).
# MaxRetentionSec 90day -- system logs older than 90 days are dropped
#                          (Nadav, 18/10). The audit trail is the console's
#                          own journal table, kept for a year.
[Journal]
SystemMaxUse=1G
SystemKeepFree=4G
MaxRetentionSec=90day
