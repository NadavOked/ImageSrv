# /etc/systemd/system/dnsmasq.service.d/imagesrv-restart.conf (#1816)
# A USB NIC / VLAN may appear after network.target, and with bind-interfaces
# (#1078) dnsmasq exits "unknown interface" until it does. Keep the strict
# binding and retry, even after a long absence of the NIC.
# Installed by deploy/setup-boot-server.sh, by tools/server-upgrade.sh, and on
# every start of imagesrv-server (#2174, server/system/dnsmasq_dropin.py) --
# this file is the one source of all three. It is ours and is overwritten;
# a local policy goes in a drop-in with another name.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5s
