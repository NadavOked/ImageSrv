# ImageSrv -- the chunk sender's socket buffer (#3124, B-NET-18).
# `chunkcast send` asks SO_SNDBUF of 4 MiB (agent/chunkcast.c, `snd = 4 << 20`).
# The kernel grants min(asked, wmem_max) * 2 (socket(7)), and a stock wmem_max is
# 212992: every wave of metal 21/11 went out with `sndbuf 4194304 425984`, a tenth
# of what was designed. The receiver's side is raised by the agent itself at run
# time (agent/lib/core/rcvbuf.sh, root in the initramfs); the sender runs on the
# server, not as root, so its ceiling is raised here -- at install, and by
# server-upgrade.sh for a server installed before. The value is the ask, no more.
net.core.wmem_max = 4194304
