# #2634: no OS login on tty2-tty6 in a normal boot. The graphical server screen
# already drops Alt+Fn (#2438); when it cannot run (no DRM/fbdev) the DCUI falls
# back to the text screen, which grabs no keyboard, and Alt+F2 reached a getty.
# With SSH closed (#1266) that was the one local login surface.
#
# A getty (and logind's autovt@, an alias of getty@) starts only when one of
# these holds:
#  * the boot is the GRUB entry "ImageSrv recovery (text console)"
#    (installer/lib/finish.sh) -- behind the GRUB password, the technician's
#    deliberate way in;
#  * first boot failed (tools/iso/firstboot.sh `fail`, which tells the operator
#    "Alt+F2 to log in") and marked it in /run -- gone on the next boot.
# Installed by deploy/setup-boot-server.sh and tools/server-upgrade.sh to
# /etc/systemd/system/getty@.service.d/imagesrv-recovery-only.conf
[Unit]
ConditionKernelCommandLine=|systemd.unit=multi-user.target
ConditionPathExists=|/run/imagesrv-login-open
