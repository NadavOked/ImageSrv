why = "#3269, ברזל 21/11 (LabRoot ב-892e891fc, ‏WAVE_START 15554): בדיקת הכתיבה (191MB/s) החליפה קצב רשת שנלמד (350m, chunk_up) ב-892m כי המגירות השתנו, ומשכפל 1 (e1000 על אפיק PCI, נקי ב-250m) איבד 431‰ ו-591‰. בדיקת הכתיבה מודדת את הדיסקים: היא תקרה של הדיסק ולא קצב רשת, והגל יוצא במינימום בין שתיהן (`_raise_cap`). התחלה שה-AIMD למד מגל שהאבדן שלו נמדד (בסיס chunk_* ו-previous.loss_permille) אינה עולה בכלל (net_learned); כל התחלה אחרת עולה לכל היותר צעד אחד (raise_step). הצעד אינו מספר חדש: הוא הצעד של ה-AIMD (`STEP_MBPS`, ה-STEP_UP של השולח שהוסר), הערכה שלא נמדדה על מנוע החתיכות."
