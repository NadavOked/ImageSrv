note = "#3268: הסוכן מדווח ב-hello (`write_check`) את תוצאת הבדיקה המתמשכת של כל מגירה שסיימה: סידורי, מצב (`ok`/`slow`, כמו שהוא קבע), MB/s בחצי האחרון, MB/s בחצי הראשון, והסיבה שלו כשהוא איטי. השרת קורא את מה שהוא זוכר על אותו סידורי (`slow_memory.of`, מעל `chunk_rate.sustained`: הגל החדש שהדיסק פיגר בו) ורושם `B62/SLOW_DISK` ישות `disk` עם שתי הראיות (`now_*`, `history_*`): `RED` (איטי עכשיו, היסטוריה מצורפת אם יש; או תקין עכשיו אבל הקצב המתמשך בגל הקודם, `slow_memory.Memory.mbps`, מתחת ל-`floor_mbps` שהסוכן דיווח על המגירה: אותו סף של הבדיקה, בלי סף חדש בשרת; סף לא ידוע = לא אדום), `INFO` (פיגר ותקין עכשיו, וקצבו המתמשך מעל הסף), `NONE` (אין היסטוריה, תקין), `UNDECIDED` (ההיסטוריה לא נקראה או הלמידה כבויה: 'לא ידוע' אינו 'אין'). `RED` ו-`INFO` חוזרים בתשובה (`write_decisions`, ראיה: מצב ומספרים) והמסך מציג אותם כמו שהם; בלי החלטה, או החלטה על תוצאה אחרת, המסך נשען על הבדיקה המקומית (אדום נשאר אדום). **מצב:** צל, כמו אזהרת K3: מוצג למפעיל גם בצל, ואינו חוסם בשום מצב (הסבב אינו קורא אותו); `brain_veto_mode=off` = לא מחושב, לא נשלח ולא נרשם. שורה אחת לכל ראיה שונה, לא לכל hello. **'איטי עכשיו' הוא הסף של הסוכן** (סוג דיסק, מדיניות HDD, שאר המגירות) ולא מחושב שוב בשרת. **לא נבדק:** על ברזל, ומה שקורה כשהלמידה האוטומטית כבויה בייצור"
