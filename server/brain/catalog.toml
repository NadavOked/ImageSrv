# קטלוג המוח של פס הייצור (#3064, #3114). מקור האמת; ה-README-ים בשכבות הם תצוגה שלו.
# אף שורת קוד לא זזה בשבילו. הבסיס: lab/vm-1113c ב-cf58981a.
#
# כל [[item]]:
#   id              S/V/N חושים · D/B/K החלטות · T/X/M/KT ספים · LR למידה · L/U/R יומן · I אינווריאנטים
#   layer           senses | decisions | thresholds | learning | log | invariants
#   status          used | reported | exists | partial | missing | unverified | planned
#   file, symbol    איפה הכלל היום. symbol = פונקציה או קבוע, והוא המצביע. חובה לכל פריט שקיים היום.
#   line            רמז בלבד, נכון ל-cf58981a. הטסט לא בודק אותו.
#   anchor          (רשות) מחרוזת שחייבת להופיע באותו קובץ, כשה-symbol הוא פונקציה גדולה.
#   also            עוד מקומות: [{ file, symbol, line, anchor }]. נבדקים כמו המקום הראשי.
#   value           הערך (בספים).
#   source          code | measured | estimate | derived | decision | policy | external | unknown
#                   | research | owner | inventory | metal | design
#   date            YYYY-MM-DD. חובה כש-source = "measured".
#   recommendation  keep (✅ קיים, להשאיר) | do (✅ עבודה חדשה) | later (⏳ אחר כך)
#   why, note       הנימוק מהמלאי, והערות.
#   rules           אילו מ-K1–K10 צורכים את הפריט. uses (ב-K): מה הכלל צורך.
#   mode            (ב-K) איך הכלל רץ היום: shadow (רושם בלבד) | enforce (מחליט בפועל). #3320
#   brain_state     (בכל פריט עם mode, #3696) decides = המוח המחליט היחיד ואין קוד ישן לחזור אליו (brain_veto_mode: off = מחליט ולא רושם;
#                   shadow/enforce = מחליט ורושם) | shadow = הקוד הישן מחליט והמוח רק רושם (off = לא רושם; shadow = רושם עם agree=; enforce = המוח מחליט).
#                   חזרה אחורה מפריט decides היא revert של ה-PR בלבד. tests/test_brain_state_3696.py.
#   gap             הפער במלאי (G1–G28).
#   learns, senses, feeds, store, reset   (בלמידה) מה נלמד, מאילו חושים, מה הוא מזין, איפה נשמר, ואיך מתאפס.
#   group, point, kind, principle, line_base   (קבוצה ג, #3677) group = "ג": נקודה ש'לא מעבירים' למוח. point = המזהה במיפוי
#                   (lab/decisions-map-1118.md). kind = invariant | policy. principle = העיקרון ב-CLAUDE.md. line_base = הקומיט
#                   שה-line שלו. המזהה של פריט כזה הוא CG-<point>, ו-why אומר למה לא מעבירים.
#                   tests/test_brain_group_c_3677.py מחזיק את כל ה-39.
#
# tests/test_brain_catalog.py נופל כשקובץ חסר, כש-symbol או anchor אינם בקובץ, על id כפול,
# על measured בלי date, ועל פריט קיים בלי file/symbol.

