note = "צל: הלמידה נשמרת, והצרכנים (B48 `wavesplit`, K3 `linkwarn`, K3 `waveeta`) מקבלים אותה במקום 'כרטיס × 90%'; ההשפעה על קצב הגל נרשמת (`wave_rate`, LR24/WAVE_RATE_LEARNED) ואינה מבוצעת. גל ישן של המנוע הקודם (בלי חושי הגל) לא נלמד: UNDECIDED. רף הדיסק (`DISK_UTIL_START`) הוא נקודת התחלה שאינה נלמדת עדיין. #3554: CLEAN דורש שהגל הגיע ל-KEEP_UP x הקצב שהתבקש (`achieved_bps`: chunk.achieved_bps) ושהדיסקים נמדדו ולא פיגרו. דיסקים שפיגרו = DISK_BOUND, לא הגיע לקצב = NOT_PUSHED, קצב שלא נקרא או דיסקים שלא נקראו = UNDECIDED; אף אחד מהם לא נלמד. ברזל 16/11: RS-1 הושג 419.6Mb/s מתוך 669 וסומן CLEAN."
