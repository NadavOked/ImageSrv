note = "#3320: הכלל היחיד שמחליט בפועל. chunk_rate.py כותב mode=enforce ב-WAVE_START וב-WAVE_RATE_LEARN, ו-start/adjust משנים את קצב הגל בפועל (#3163, #3269). אינו תלוי ב-brain_veto_mode, ויצא מצל בלי קריטריון (#3321). #3464: החלטה חדשה בצל, WAVE_SERVER_CAP (CAP/FITS; בלי תקרה נלמדת אין שורה): הקצב שנבחר מול תקרת הקריאה של דיסק הספרייה שנלמדה מגלים ש-server_io סימן server_disk (server_cap.learn), ורק מגל שהדיסק היה רווי בו (util >= SATURATED_UTIL, #3525): גל עסוק אינו ראיה לתקרה. הקצב החי לא משתנה, אלא כשההגדרה brain_server_cap דלוקה (כבויה כברירת מחדל). #3498: הורדה (chunk_down) שהגל האחרון שלימד נתן אינה נשמרת לתמיד: כש-RELEASE_WAVES הגלים שאחריה כולם server_disk, השולח לא ישן בגלל הקצב שלו (paced_ms) יותר מ-100-CUT_PERCENT אחוז, והקצב שנשלח בפועל רחוק מהתקרה (מתחת ל-CUT_PERCENT אחוז ממנה), הקצב עולה צעד אחד (chunk_release) -- server_release. לא נמדד = UNDECIDED, בלי שינוי. חסר: מונה המתנה-לקריאה בשולח #3506: WAVE_WRITE_RATE (PROBE/HOLD/RAISE/CUT) -- ה-`--write-kbps` של מחיצה הוא לולאה בין גלים: עולה כשהדיסקים עמדו בקצב והשולח ישן ל-`--write-kbps`, יורד כשדיסק פיגר, ובדיקת הכתיבה היא ההתחלה בלבד. #3526: ירידה מדורגת לפי החלק מהחתיכות שדולגו עבור הכונן (chunk_pass_counters), ומתחת ל-BEHIND_PERMILLE (1 לאלף) HOLD עם behind_negligible; בלי ספירה צעד אחד למטה (drive_behind_unmeasured), לא 25%. #3530: גם התקרה הנלמדת לכונן (chunk_rate.sustained) נלמדת רק מגל שפיגר באמת: מתחת ל-BEHIND_PERMILLE הכונן עמד בקצב, ושולח שנעצר ל-`--kbps` יותר מ-SENDER_ASLEEP_MAX מהמעבר הראשון אינו ראיה (בלי זה שולח איטי מוריד את התקרה). גל שלא נמדד (אין chunk_pass_counters שספרו, כשל קריאה, או אין paced_ms) אינו ראיה ואינו נספר, ונרשם בראיה (ceiling_unmeasured). mode=enforce, לכל החלטה הראיה. #3977: שני קלטים שהשולח שהוסר (#3173) נתן ומנוע החתיכות לא קיבל, **בצל כברירת מחדל** (ההגדרה brain_rate_inputs: off / shadow / enforce; נדב 21/11: שלושה סבבים בצל ואז אחד פעיל, ו-Jev בודק כל אחד) -- בצל כל הכרעה נרשמת עם mode=shadow, עם aimd_bps (הקצב בלי הקלט) ו-would_bps (הקצב איתו), והקצב של הגל הוא של ה-AIMD; ב-enforce ההכרעה משנה את הקצב. שניהם יכולים רק להחזיק או להוריד את מה שה-AIMD נתן, אף פעם לא להעלות ולא מתחת לרצפה: WAVE_GOODPUT (PEAK/CLIMB/UNDECIDED; LR27) -- לפני טיפוס (chunk_up) משווים את הקצבים שנוסו, וקצב שנוסה מעל השיא ואף משכפל של הגל לא כתב בו יותר מ-GOODPUT_NOISE עוצר את הטיפוס (chunk_peak); WAVE_UNSAFE_RATE (WALL/NO_WALL/UNDECIDED; LR28) -- משכפל שהשרת איבד במעבר ראשון נרשם עם הקצב (CLONER_DROP/DROPPED, על הישות machine), UNSAFE_MIN_DROPS נפילות שלא הופרכו הן חומה, וגל עם המשכפל הזה לא נוחת עליה או מעליה (chunk_unsafe), גם כשאין גל שלימד וגם כשבדיקת הכתיבה מחליפה קצב ישן (start, unsafe_wall). המשכפל אינו מוצא מהגל (נדב 16/11: המוח מציע, לא פוסל). לא נמדד (אין drives, משכפל שלא נמדד, קצב אחד שנוסה, זיכרון שלא נקרא) = UNDECIDED והקצב בדיוק כמו בלי הקלט. הספים הם הערכות שלא נמדדו על מנוע החתיכות. #3269 (ברזל 21/11, WAVE_START 15554): בדיקת הכתיבה היא תקרה של הדיסקים ולא קצב רשת -- היא תמיד יכולה להוריד את ההתחלה, אבל קצב רשת שה-AIMD למד ממדידה אינו עולה בגללה, וכל התחלה אחרת עולה לכל היותר צעד (T-PROBE-RAISE, `_raise_cap`; start_check.raise_by)."
