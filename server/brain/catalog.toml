note = "#3662 (18/11): `combine` מקפל את קריאות השערים לפסק אחד: `BLOCK` אם שער אחד הוכיח; אחרת `WARN`; אחרת `UNDECIDED` אם שער לא הצליח לבדוק (אינו `OPEN` וגם אינו `BLOCK`); `OPEN` רק כשכולם `OPEN`. ב-`shadow` (ברירת המחדל, וגם לכל ערך לא מוכר של `brain_round_gate`) הפתיחה כמו קודם, והפסק של אחרי הפתיחה (`record_after_open`, `point=after_open`, כל עשרת השערים) נרשם עם `legacy=opened` ו-`agreement=yes|no`: החומר של שער המעבר #3563. `enforce` ממומש וכבוי, ואינו ב-`WRITE_SETTINGS`: `open_round` קורא ל-`opengate.gate` לפני שהוא תופס את חריץ הסבב, מתוך שערי `pre_open` בלבד (שבעה: RAID, מקום, בריאות, AHCI, PXE, כרטיס רשת, מוחזק; האתחולים, השאלות והקושחה קוראים את שורת הסבב ועוד אין אחת), ו-`BLOCK` מסרב (`RoundGateRefusal`, 409). AHCI לפני הפתיחה אינו `BLOCK` לעולם (ה-`BLOCK` שלו הוא של פס ייצור, ונקבע לפי שורת הסבב). **לא עבר למוח, במכוון (קבוצה ג/ב):** דיסק אדום (`disk_rule`), האימג' חייב להיכנס פיזית (`fit_refusal`), בחירת החריצים (`_validate_target_slots`), ו-`min_free_gb` (הגדרה של המשתמש); הם רצים לפני הפסק ומסרבים כמו קודם. **לא נמדד:** אי-הסכמה בין הפסק לקוד הישן על ברזל; אין סבב שנחסם בפועל; `enforce` נבדק על קריאות מזויפות בלבד. WARN עוד אינו מוצג למפעיל (הערוץ האחיד, #3654)"
