<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ImageSrv — מוניטור</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=12.52">
<link rel="icon" href="favicon.ico?v=12.52" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=12.52">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=12.52">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=12.52">
<link rel="stylesheet" href="design-tokens.css?v=12.52">
<link rel="stylesheet" href="console.css?v=12.52">
<script>
  (function () {
    var choice = localStorage.getItem("imagectl-theme");
    if (choice === "dark" || choice === "light")
      document.documentElement.setAttribute("data-theme", choice);
  })();
</script>
<style>
  .mon-wrap { display: flex; flex-direction: column; height: 100vh; }
  /* אותה כותרת כהה כמו שאר האפליקציה (Stage 2) — לא פאנל בהיר נפרד. */
  .mon-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px; height: var(--header-height); flex: none;
    background: var(--clr-header); color: var(--clr-header-text);
  }
  .mon-bar h1 { font-size: 15px; margin: 0; font-weight: 600; color: inherit; flex: none; white-space: nowrap; }
  .mon-bar .spacer { flex: 1; }
  .mon-bar .btn { flex: none; }
  /* ‏#1852: מי מחזיק / בקשת שליטה — שורה אחת, כמו הסטטוס. */
  .control { display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; flex: none; }
  /* ‏#1837: הסטטוס הוא שורה אחת שמתכווצת לפני השם והכפתורים — סיבה ארוכה
     נקטעת ב-… (המלאה ב-title ובשכבה שעל המסך), ולא גולשת על שם המכונה. */
  .status { font-size: 13px; padding: 3px 10px; border-radius: var(--r);
    flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .status.ok { color: #8FE39B; }
  .status.bad { color: #F3A79C; }
  .mon-screen {
    flex: 1; display: flex; align-items: center; justify-content: center; position: relative;
    background: #101014; overflow: auto;
  }
  /* ‏canvas עם רקע שחור עד הפריים הראשון; ממוקד כדי ללכוד מקלדת.
     ‏cursor:none — הסמן המרוחק כבר מצויר לתוך ה-framebuffer (native-gui
     מרנדר את הסמן שלו ל-fb0), אז מסתירים את הסמן המקומי של הדפדפן כדי
     שלא יופיעו שני סמנים ("double cursor"). ‏#1475: נדב 16/10 — סמן אחד
     משותף; מי שליד המכונה רואה איפה המפעיל מצביע. */
  #screen { max-width: 100%; max-height: 100%; outline: none; background: #000; cursor: none; }
  #screen.disconnected { filter: brightness(35%); }
  .disconnect-overlay {
    display: none; position: absolute; inset: 0; z-index: 2; align-items: center;
    justify-content: center; padding: 24px; color: #fff; font-size: 20px;
    font-weight: 600; text-align: center; pointer-events: none;
  }
  .disconnect-overlay.visible { display: flex; }
  /* מסך מלא (console-full.html #fs): הדף כולו — ולא רק .mon-wrap — עובר למסך מלא, כדי שגם חלון האישור
     של הפעלה מחדש / כיבוי ייראה. הסרגל הופך לכדור צף שמוסתר, ומופיע 2.5 שניות אחרי תזוזת עכבר. */
  html:fullscreen .mon-bar {
    position: fixed; top: 14px; inset-inline: 0; margin-inline: auto; z-index: 5;
    width: max-content; max-width: calc(100% - 24px); height: auto; padding: 6px 12px;
    border-radius: 99px; background: rgb(28 35 42 / 80%); backdrop-filter: blur(16px);
    opacity: 0; transform: translateY(-8px); pointer-events: none;
    transition: opacity var(--dur-base) var(--ease), transform var(--dur-base) var(--ease);
  }
  html:fullscreen.bar-on .mon-bar { opacity: 1; transform: none; pointer-events: auto; }
  html:fullscreen .mon-bar .btn { background: transparent; color: #fff; border-color: rgb(255 255 255 / 35%); }
  html:fullscreen .mon-bar .btn:hover { background: rgb(255 255 255 / 14%); }
  html:fullscreen .mon-screen { overflow: hidden; }
</style>
</head>
<body>
<div class="mon-wrap">
  <div class="mon-bar">
    <h1 id="title">מוניטור</h1>
    <span id="status" class="status">מתחבר…</span>
    <span id="control" class="control" aria-live="polite"></span>
    <div class="spacer"></div>
    <button class="btn" id="reboot-btn" title="מפעיל מחדש את המחשב המנוטר">הפעלה מחדש</button>
    <button class="btn danger" id="poweroff-btn" title="מכבה את המחשב המנוטר">כיבוי</button>
    <button class="btn" id="reconnect">התחבר מחדש</button>
    <button class="btn" id="fs-btn" title="מסך מלא — Esc לחזרה">מסך מלא</button>
  </div>
  <div class="mon-screen">
    <canvas id="screen" width="1024" height="768" tabindex="0"></canvas>
    <div id="disconnect-overlay" class="disconnect-overlay" role="alert"></div>
  </div>
</div>
<!-- מודאל אישור לפעולה הרסנית על מכונה חיה (#1270): שאלה, השלכה, ביטול וכפתור אדום.
     prompt()/confirm() חסומים בדפדפן מוטמע, ולכן מודאל של הדף. משתמש
     במחלקות של console.css שכבר נטענו כאן. -->
<div class="modal-backdrop" id="pmodal">
  <div class="modal" id="pmodal-box">
    <div class="modal-h"><strong id="pmodal-title">פעולה</strong></div>
    <div class="modal-b">
      <div class="confirm-box" id="pmodal-msg"></div>
      <div class="danger-confirm">הפעולה מתבצעת מיד על המחשב <b id="pmodal-name"></b>, ועבודה שלא נשמרה עליו תאבד.</div>
      <p class="danger-text" id="pmodal-error"></p>
    </div>
    <div class="modal-f">
      <button class="btn danger" id="pmodal-ok">אישור</button>
      <button class="btn" id="pmodal-cancel">ביטול</button>
    </div>
  </div>
</div>
<script src="monitor.js?v=3.40"></script>
</body>
</html>
