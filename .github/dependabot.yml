# Dependabot — עדכוני גרסה אוטומטיים.
#
# **‏pip נמצא כאן בכוונה בתור "לא", ולא בהשמטה.**
# ‏`server/requirements.txt` מצמיד את fastapi ו-uvicorn לגרסה **שדביאן 13
# מספקת ב-apt** — כי זו הגרסה שכל שרת ImageSrv מריץ בפועל. הקובץ עצמו
# מסביר: "שדרוג הוא החלטה, לא תוצאה של תאריך ההתקנה". ‏`fastapi>=0.110`
# הלא-מוצמד היה השורש של #113, ‏CI אדום ב-12 קומיטים מול מעבדה ירוקה.
# ‏PR אוטומטי שמרים את המספר היה משחזר בדיוק את זה.
#
# עדכוני **אבטחה** של pip כן פעילים — הם מוגדרים ברמת הריפו ולא כאן,
# והם מגיעים כ-PR לסקירה. פגיעות היא סיבה לשדרג; תאריך אינו.
#
# ‏GitHub Actions כן מתעדכן: ב-2026-08-30 ה-CI כבר הזהיר ש-actions/checkout@v4
# ו-codeql-action@v3 מורצים בכפייה על Node 24 כי Node 20 הוצא משימוש.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
