# CodeQL — מה נסרק (#2135, הכרעת נדב 24/10).
#
# טסטים ומוקאפים מוחרגים: טסט שמריץ את console.js ב-vm, שמזייף TLS ישן כדי
# לבדוק דחייה, או שכותב קובץ עם הרשאות רחבות כדי לבדוק שהן מתוקנות — עושה
# בכוונה את מה שהכלל מחפש. מוקאפ HTML אינו קוד שנפרס. ההתראות שלהם הסתירו
# את מה שאמיתי (355 פתוחות ב-24/10, ואף אחת מה-Critical/High לא בקוד שנפרס
# הייתה ממשית). הערות `# codeql[...]` בקוד **אינן** משתיקות התראות ב-GitHub;
# false positive בקוד שנפרס מבוטל ידנית עם נימוק, ולא כאן.
#
# server/static/vendor (#2160): קוד צד שלישי (noVNC ו-pako, עותק מחבילת Debian
# ללא שינוי — ראו server/static/vendor/novnc/README.md). 19 התראות עליו נבעו
# מ-crc32.js של pako שמייצא את makeTable במקום crc32, בנתיב gzip בלבד; noVNC
# קורא ל-deflateInit/inflateInit (zlib, לא gzip) ולכן הנתיב לא רץ אצלנו, ואנחנו
# לא מתקנים קוד ספק — זה היה פורק את "ללא שינוי" ומתבטל בכל רענון של הספק.
paths-ignore:
  - tests
  - docs/design
  - docs/research
  - server/static/vendor
