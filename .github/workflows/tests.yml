# ImageSrv — הבדיקות רצות על כל push ו-pull request (אפיון, נספח ג' פער 7).
#
# ubuntu-latest מביא gcc, ולכן גם tests/test_fanout.py — הכותב המקבילי
# עם הבידוד, הסיכון שנספח ב' מדרג כגבוה — רץ כאן באמת, מול צינורות.
name: tests

on:
  # ‏`push` בלי סינון ענף רץ **במקביל** ל-`pull_request`, וכל PR הריץ
  # את כל המטריצה פעמיים. נמדד ב-2026-08-31: ארבע ריצות pytest
  # במקום שתיים, על כל דחיפה.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ריצה אחת לכל ענף ב-PR: דחיפה חדשה מבטלת את קודמתה.
#
# על main כל ריצה היא הרשומה של מיזוג, ואסור לבטל אותה. זה מה שההערה
# הקודמת הצהירה — והמנגנון עשה את ההפך. עם קבוצה אחת לכל main,
# GitHub מרשה **ריצה ממתינה אחת** בלבד: כל דחיפה חדשה מבטלת
# את הממתינה שלפניה, גם כש-`cancel-in-progress` הוא false. ב-2026-09-01 מוזגו 15
# PRs ב-67 שניות, ו-13 מהריצות בוטלו — 13 קומיטים על main בלי שום
# ראיית בדיקה. הם לא נראים אדומים, ולכן איש לא הבחין (עיקרון 5).
#
# התיקון: על push, ה-SHA נכנס לשם הקבוצה — לכל קומיט קבוצה משלו, ואין מה
# לדחוק. ב-PR הקבוצה נשארת לפי ענף, כדי שדחיפה חדשה תמשיך לבטל.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ubuntu-24.04  # #2401: ubuntu-latest עבר ל-26.04 ב-04/11 והפיל טסטים; נעול עד שנתמוך ב-26.04
    # 17/09: 4,200 טסטים = ~18 דק' על runner; 15 ביטל בשקט ארבע ריצות (לא אדום — "cancelled").
    timeout-minutes: 150
    # שתי גרסאות פייתון, כי לפרויקט יש שתיים ולא אחת: דביאן 13 — הייצור
    # וגם מעבדת ה-VM — מריצה 3.13, ותחנת הפיתוח מריצה 3.12. עד #113 ה-CI
    # בדק רק את 3.12, כל האימות הידני נעשה על 3.13, ואף אחת מהשתיים לא
    # ידעה על השנייה. `fail-fast: false` כי כישלון באחת אינו סיבה לבטל את
    # המדידה של השנייה — צריך לדעת אם זו גרסה או קוד.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    # כאן הכלים אמורים להיות, ולכן חבילה שדילגה היא תקלה ולא הערה:
    # ‏gcc, ‏bash, ‏hivexget ו-libhivex-dev מותקנים בשלב הבא, וחבילת apt
    # ששינתה שם או תמונת runner שהתעדכנה היו משאירות את הבנייה ירוקה
    # עם אפס כיסוי לשלושת הרכיבים המסוכנים ביותר (#52).
    env:
      IMAGESRV_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # התלויות מוצמדות ב-requirements.txt, ולכן מפתח המטמון יציב
          # ומתחלף רק כששדרוג מוכרע במפורש.
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ‏#2164: ‏pytest-xdist — הריצה המקבילית. מוצמד לגרסה של שער המעבדה
          # ‏(דביאן 13, ‏#2121), שעליה נמדד ש-`--dist load` מדווח worker שקרס
          # ככישלון בשמו, ו-`loadgroup` נתקע.
          pip install -r server/requirements.txt pytest httpx pytest-xdist==3.6.1
          # ‏#1356: partclone/gdisk/ntfs-3g/dosfstools/pv — מנוע השיכפול המקומי (#1322)
          # רץ על loop devices כ-root; בלעדיהם REQUIRE_NATIVE מכשיל (v0.73.0 היה אדום).
          # ‏tests/test_hivewrite.py מקמפל את העוזר מול libhivex ומאמת
          # עם hivexget — בלי החבילות האלה הוא היה מדולג בשקט. עכשיו
          # ‏IMAGESRV_REQUIRE_NATIVE הופך התקנה שנכשלה לכישלון בדיקות.
          # ‏busybox עובר לכאן משלב הפרסינג שבסוף: ‏tests/test_json_escape.py
          # מריץ את `json_escape` תחת ה-awk של busybox דווקא, כי gawk (כאן),
          # mawk (דביאן) ו-busybox awk קוראים אחרת את רצפי הבריחה של gsub —
          # וזה בדיוק ההבדל שהשאיר את #145 ירוק בזמן שהסוכן נשבר.
          # #1210: בלי update האינדקס השמור ב-runner מחזיר 404 כשהמראה מתקדמת.
          # #2186: mtools..zstd -- tests/test_usb_bios_grub_2186.py builds a real USB stick (GRUB/syslinux MBR).
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libhivex-dev libhivex-bin dash busybox nodejs libpango1.0-dev libcairo2-dev libdrm-dev libharfbuzz-dev libfribidi-dev fonts-ibm-plex fontconfig libvncserver-dev \
            partclone gdisk ntfs-3g dosfstools e2fsprogs pv jq curl \
            mtools grub-pc-bin syslinux syslinux-common cpio zstd >/dev/null
          # איזה busybox רץ כאן -- ‏gsub שלו נבדל בין בניות, וה-runner אינו
          # בהכרח מה שנארז ב-initrd. בלי השורה הזאת אין דרך לדעת בדיעבד.
          busybox | head -1
      # ‏#2064: גלאי Impeccable בגרסה הנעולה, לשער tests/test_impeccable_gate.py.
      # ה-sha וה-URL נקראים מ-tests/impeccable_gate.py (מקור יחיד) ומפתחים את
      # המטמון — הורדה אחת לכל הצמדה, לא בכל ריצה. ‏`fetch` מאמת sha גם על
      # מה שעלה מהמטמון, והטסט מאמת שוב לפני ההרצה. הורדה שנכשלה או sha שאינו
      # תואם — השלב אדום; בלעדיו ‏REQUIRE_NATIVE מכשיל את השער בשמו.
      - name: Impeccable pin (#2064)
        id: impeccable
        # sha256 by name, so tools/agents/doctor.py sees who writes the output
        # the cache key reads; no sha (pin failed: no pipefail here) = red
        run: |
          sha=$(python tests/impeccable_gate.py pin | sed -n 's/^sha256=//p')
          [ -n "$sha" ] || { echo "impeccable_gate.py pin: no sha256" >&2; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/impeccable
          key: impeccable-${{ steps.impeccable.outputs.sha256 }}
      - name: Fetch the pinned Impeccable detector (#2064)
        run: |
          dest="$HOME/.cache/impeccable/imp"
          python tests/impeccable_gate.py fetch "$dest"
          echo "IMAGESRV_IMPECCABLE_BIN=$dest" >> "$GITHUB_ENV"
      # ‏`set -o pipefail` אינו קישוט: ברירת המחדל של Actions היא
      # ‏`bash -e`, **בלי pipefail**, ולכן `pytest | tee` היה מחזיר את
      # קוד היציאה של `tee` — כלומר 0 תמיד. זה בדיוק הדפוס שעיקרון 5
      # אוסר, והוא כבר הפיל את הפרויקט פעם (‏#52: חבילות שדילגו בשלמותן
      # וה-CI נשאר ירוק).
      #
      # ‏#2164: במקביל (‏`-n auto --dist load`, עובד לכל vCPU) — סדרתית זה היה
      # ‏1:50–2:10 לכל גרסה (ריצה 40819406095, ‏29/10), וכל פרסום חיכה לזה.
      # ובמקביל קוד היציאה של pytest כבר אינו הראיה: הוא 0 גם כשטסט לא רץ
      # (worker שבלע node, תוסף שמסנן). לכן הפסק הוא של שער המעבדה (#2121),
      # ‏`tools/git/lab_gate.py`: ‏collect של העץ הזה עם אותם ארגומנטים — מה
      # **שצריך** לרוץ; ‏junit של הריצה — מה **שרץ**; וירוק רק כשכל id שנאסף
      # נמצא ב-junit, אין FAILED/ERROR/SKIPPED מחוץ ל-`.github/ci-gate-allowed.json`,
      # ובדיקות הסשן של conftest (יתומים, שולח אמיתי) נרשמו — וריקות.
      # הפלט מחוץ לעץ (`RUNNER_TEMP`): טסט שבודק את העץ לא יראה אותו.
      - name: Run the test suite (fanout included)
        run: |
          set -o pipefail
          args=(-p no:cacheprovider -m "not uinput and not vm_it")
          gate="$RUNNER_TEMP/gate"
          mkdir -p "$gate"
          if ! python tools/git/lab_gate.py collect --out "$gate/collected.txt" -- "${args[@]}" \
              < /dev/null > "$gate/collect.log" 2>&1; then
            tail -n 30 "$gate/collect.log"
            echo "gate: CANNOT VERIFY -- collect-only failed; nothing to compare the run with"
            exit 2
          fi
          tail -n 1 "$gate/collect.log"
          # ‏#2118: שני שלבים. מקבילי — `-m "not serial"`; ואחריו, באותו job,
          # סדרתי (בלי `-n`) לטסטים הרגישים לעומס. ‏`-m` נוסף דורס את הקודם,
          # ולכן הביטוי המלא נבנה כאן. הפסק אחד, על האיחוד: ‏collect הוא כל
          # העץ, ושני ה-junit נספרים יחד — טסט שלא רץ באף שלב הוא אדום.
          base='not uinput and not vm_it'
          set +e
          IMAGESRV_SESSION_PROBLEMS="$gate/problems-parallel.json" \
            python -m pytest tests -q -p no:cacheprovider -m "$base and not serial" -n auto --dist load \
            --junitxml="$gate/run-parallel.xml" < /dev/null 2>&1 | tee pytest.log
          rc1=${PIPESTATUS[0]}
          IMAGESRV_SESSION_PROBLEMS="$gate/problems-serial.json" \
            python -m pytest tests -q -p no:cacheprovider -m "$base and serial" \
            --junitxml="$gate/run-serial.xml" < /dev/null 2>&1 | tee -a pytest.log
          rc2=${PIPESTATUS[0]}
          set -e
          python tools/git/lab_gate.py verdict --collected "$gate/collected.txt" \
            --junit "$gate/run-parallel.xml" --junit "$gate/run-serial.xml" \
            --problems "$gate/problems-parallel.json" --problems "$gate/problems-serial.json" \
            --allowed .github/ci-gate-allowed.json --pytest-rc "$rc1" --pytest-rc "$rc2"
      # ‏#949: חמשת טסטי evdev כותבים ל-/dev/uinput וקוראים /dev/input/event*
      # — במעבדה root, כאן sudo עם אותו אינטרפרטר (אותם site-packages).
      # ‏`-m uinput` בלי טסטים = יציאה 5 של pytest = כישלון, לא "עבר".
      - name: evdev/uinput tests as root (#949)
        run: |
          set -o pipefail
          sudo modprobe uinput
          test -c /dev/uinput
          sudo -E "$(which python)" -m pytest tests -q -p no:cacheprovider -m uinput 2>&1 | tee pytest-uinput.log

      # ‏e2e_simulation מוחק את תיקיית העבודה שלו ב-`finally`, ולכן אין
      # מה להעלות ממנה. מה שכן שורד הוא הפלט — והוא כבר מכיל את זנב
      # לוג השרת, שהתסריט מדפיס בכל מסלול כישלון.
      - name: End-to-end simulation — four machines against a real server
        run: |
          set -o pipefail
          python tools/e2e_simulation.py 2>&1 | tee e2e.log

      # רק בכישלון. ריצה ירוקה אינה זקוקה לארכיון, והעלאה בכל ריצה
      # שורפת את מכסת האחסון על מה שאיש לא יפתח.
      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-py${{ matrix.python-version }}
          path: |
            pytest.log
            pytest-uinput.log
            e2e.log
          retention-days: 14
          if-no-files-found: ignore
      - name: Agent scripts parse under a real POSIX shell
        run: |
          find agent/lib -type f -name '*.sh' -print0 > "$RUNNER_TEMP/agent-lib-files"
          mapfile -d '' -t libs < "$RUNNER_TEMP/agent-lib-files"
          [ "${#libs[@]}" -ge 121 ] || { echo "agent/lib scan found fewer than 121 scripts" >&2; exit 1; }
          for f in agent/imagesrv-agent agent/init "${libs[@]}"; do
            dash -n "$f" && busybox ash -n "$f"
          done
