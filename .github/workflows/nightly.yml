# ריצה לילית מלאה — לתפוס סחיפת סביבה, לא רגרסיה בקוד.
#
# רגרסיה בקוד נתפסת ב-PR. מה שלא נתפס שם הוא **מה שמשתנה מתחת לרגליים
# כשהקוד לא זז**: תמונת runner שהתעדכנה, חבילת apt ששינתה שם, גרסת
# ספרייה שנפתרה אחרת, כלי שהוסר מהתמונה.
#
# ‏#113 היה בדיוק זה: ‏`fastapi>=0.110` הלא-מוצמד נפתר ל-0.115.11 במעבדה
# ול-0.141.1 ב-CI, ובין השתיים `include_router` הפסיק לשטח ניתובים.
# ‏CI היה אדום 12 קומיטים בזמן שהמעבדה הייתה ירוקה, ואיש לא הבחין.
#
# הריצה הזאת **אינה חוסמת דבר** — אין מה לחסום בשלוש לפנות בוקר. היא
# פותחת Issue כשהיא נכשלת, כי ריצה לילית שנכשלת ואיש לא רואה גרועה
# מלא להריץ אותה: היא **נראית** כמו ניטור.

name: nightly

on:
  schedule:
    - cron: "0 1 * * *"          # ‏03:00 בישראל (‏UTC+2 / +3)
  workflow_dispatch:              # ולהרצה ידנית, כדי שאפשר יהיה לבדוק אותה

permissions:
  contents: read
  issues: write

jobs:
  full:
    runs-on: ubuntu-24.04  # #2401: ubuntu-latest עבר ל-26.04 ב-04/11 והפיל טסטים; נעול עד שנתמוך ב-26.04
    # #2134: 30 דק' ביטלו את הריצה כל לילה (cancelled, 20-24/10): החבילה לוקחת
    # ~90 דק' על runner (tests.yml: 150). בדיוק כמו tests.yml -- ביטול אינו אדום.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      IMAGESRV_REQUIRE_NATIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest httpx pytest-xdist==3.6.1
          # #1210: בלי update האינדקס השמור ב-runner מחזיר 404 כשהמראה מתקדמת.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libhivex-dev libhivex-bin dash busybox nodejs libpango1.0-dev libcairo2-dev libdrm-dev libharfbuzz-dev libfribidi-dev fonts-ibm-plex fontconfig libvncserver-dev             partclone gdisk ntfs-3g dosfstools e2fsprogs pv jq curl mtools grub-pc-bin syslinux syslinux-common cpio zstd >/dev/null
          busybox | head -1
      # ‏#2064: גלאי Impeccable בגרסה הנעולה, לשער tests/test_impeccable_gate.py.
      # ה-sha וה-URL נקראים מ-tests/impeccable_gate.py (מקור יחיד) ומפתחים את
      # המטמון — הורדה אחת לכל הצמדה, לא בכל ריצה. ‏`fetch` מאמת sha גם על
      # מה שעלה מהמטמון, והטסט מאמת שוב לפני ההרצה. הורדה שנכשלה או sha שאינו
      # תואם — השלב אדום; בלעדיו ‏REQUIRE_NATIVE מכשיל את השער בשמו.
      - name: Impeccable pin (#2064)
        id: impeccable
        # sha256 by name, so tools/agents/doctor.py sees who writes the output
        # the cache key reads; no sha (pin failed: no pipefail here) = red
        run: |
          sha=$(python tests/impeccable_gate.py pin | sed -n 's/^sha256=//p')
          [ -n "$sha" ] || { echo "impeccable_gate.py pin: no sha256" >&2; exit 1; }
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/impeccable
          key: impeccable-${{ steps.impeccable.outputs.sha256 }}
      - name: Fetch the pinned Impeccable detector (#2064)
        run: |
          dest="$HOME/.cache/impeccable/imp"
          python tests/impeccable_gate.py fetch "$dest"
          echo "IMAGESRV_IMPECCABLE_BIN=$dest" >> "$GITHUB_ENV"

      # מה שהותקן בפועל, לא מה שביקשנו. כשריצה לילית נכשלת בלי שהקוד
      # זז, זו השורה הראשונה שמסבירה למה.
      - name: What the environment actually is
        run: |
          {
            echo "## הסביבה בפועל"
            echo '```'
            python -V
            pip freeze | grep -iE "fastapi|uvicorn|pytest|httpx" || true
            dpkg -l | grep -E "libhivex|busybox|dash" | awk '{print $2, $3}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # #2263: ב-31/10 הריצה הסדרתית לקחה 142 מתוך 150 דקות.
      # כעת אותם שני שלבים כמו tests.yml: מקבילי, ואז serial, עם פסק משותף.
      - name: Full suite
        run: |
          set -o pipefail
          args=(-p no:cacheprovider -m "not uinput and not vm_it")
          gate="$RUNNER_TEMP/gate"
          mkdir -p "$gate"
          if ! python tools/git/lab_gate.py collect --out "$gate/collected.txt" -- "${args[@]}" \
              < /dev/null > "$gate/collect.log" 2>&1; then
            tail -n 30 "$gate/collect.log"
            echo "gate: CANNOT VERIFY -- collect-only failed; nothing to compare the run with"
            exit 2
          fi
          tail -n 1 "$gate/collect.log"
          base='not uinput and not vm_it'
          set +e
          IMAGESRV_SESSION_PROBLEMS="$gate/problems-parallel.json" \
            python -m pytest tests -q -p no:cacheprovider -m "$base and not serial" -n auto --dist load \
            --junitxml="$gate/run-parallel.xml" < /dev/null 2>&1 | tee pytest.log
          rc1=${PIPESTATUS[0]}
          IMAGESRV_SESSION_PROBLEMS="$gate/problems-serial.json" \
            python -m pytest tests -q -p no:cacheprovider -m "$base and serial" \
            --junitxml="$gate/run-serial.xml" < /dev/null 2>&1 | tee -a pytest.log
          rc2=${PIPESTATUS[0]}
          set -e
          python tools/git/lab_gate.py verdict --collected "$gate/collected.txt" \
            --junit "$gate/run-parallel.xml" --junit "$gate/run-serial.xml" \
            --problems "$gate/problems-parallel.json" --problems "$gate/problems-serial.json" \
            --allowed .github/ci-gate-allowed.json --pytest-rc "$rc1" --pytest-rc "$rc2"

      - name: End-to-end simulation
        run: python tools/e2e_simulation.py

  # ‏Issue אחד לכשל, ולא אחד ללילה: ריצה שנכשלת שבוע ברצף תייצר שבע
  # שורות רעש שמתארות את אותה תקלה. השאילתה מחפשת Issue פתוח עם אותה
  # תווית, ומוסיפה תגובה במקום לפתוח חדש.
  report:
    needs: full
    if: failure()
    runs-on: ubuntu-24.04  # #2401: ubuntu-latest עבר ל-26.04 ב-04/11 והפיל טסטים; נעול עד שנתמוך ב-26.04
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label nightly-failure --state open --limit 1 --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "נכשלה שוב: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🌙 הריצה הלילית נכשלה" \
              --label nightly-failure \
              --body "$(printf 'הריצה הלילית נכשלה והקוד לא זז מאז הריצה הקודמת.\n\nהחשוד הראשון הוא **הסביבה**, לא הקוד: תמונת runner, חבילת apt, גרסת ספרייה. סיכום הריצה מכיל את מה שהותקן בפועל.\n\n%s\n\nה-Issue הזה מתעדכן בתגובה בכל כישלון נוסף, ולא נפתח מחדש.' "$RUN")"
          fi
