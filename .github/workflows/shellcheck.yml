# ShellCheck — ניתוח סטטי של קוד המעטפת.
#
# למה זה כאן: בסוכן יש ~3,900 שורות POSIX sh שרצות **כ-root ומול
# דיסקים**, וזו השכבה שהכי קשה לבדוק בטסטים — היא צריכה מכונה אמיתית.
# עד 2026-08-31 היא לא נסרקה בכלל: CodeQL כיסה פייתון בלבד.
#
# מה הריצה הראשונה מצאה מיד: **שבע הנחיות `# shellcheck disable=`
# שכתובות בתחביר שגוי** (`-- הסבר` במקום שורת הערה נפרדת). המשמעות
# לא היתה רק שההשתקה לא עבדה — shellcheck **הפסיק לנתח** שם
# ("Fix to allow more checks"), וכל תיקון חשף עוד שתיים שהיו מוסתרות
# מאחורי הקודמות. זה עיקרון 5 בתחפושת: כלי בדיקה שנכשל בשקט ונראה
# כאילו עבר.
#
# הסף החוסם הוא `warning` ומעלה. שלושה קודים מוחרגים כי הם תוצר של
# מבנה הקוד ולא של באג: הסוכן טוען את `lib/` דרך נתיב משתנה, ולכן
# shellcheck אינו יכול לעקוב (SC1090) — ומכאן מפל שווא של "משתנה לא
# בשימוש" (SC2034) ו"משתנה לא מוקצה" (SC2154) על כל מה שמוגדר בקובץ
# אחד ונקרא באחר. ההערות (`note`) מדווחות ואינן חוסמות.
#
# ── רשימת הקבצים נגזרת מהעץ, ואינה נכתבת ביד (#371) ──────────────────
# עד 2026-09-04 ישבו כאן **חמש רשימות ידניות**. שתי תקלות נפרדות יצאו
# מאותו שורש: קובץ מעטפת חדש לא נסרק עד שמישהו זכר להוסיף אותו (#247),
# והרשימות נקבו בנתיבים ש**הפרסום הנקי מוציא** (`tools/lab/`,
# `tools/git/`, `tools/agents/`, `tools/discuss.sh`,
# `tools/agent-claim.sh`, `tools/issue-new.sh`) — ולכן המניפסט סיווג
# את הקובץ הזה כפרטי, והסורק נעלם מהריפו הציבורי, שהוא הריפו היחיד
# שמריץ CI (#317). שתי התקלות הן אותו כשל: **היעדר סריקה שנראה בדיוק
# כמו סריקה שעברה** (עיקרון 5).
#
# הגזירה הושוותה שורה-בשורה לחמש הרשימות לפני ההחלפה: **38 קבצים
# בשני הצדדים, אפס הפרשים, ואותו ניב לכל קובץ.** אותו קובץ רץ ללא
# שינוי בשני הריפואים — קובץ שאינו קיים פשוט אינו נמצא ואינו מפיל.
#
# ניכוי חדש כאן חייב נימוק ב-`EXEMPT` של `tests/test_shellcheck_coverage.py`
# — הטסט נופל אם נוסף כאן ניכוי שאין לו נימוק שם.

name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# ריצה אחת לכל ענף. דחיפה חדשה בזמן שקודמתה עוד רצה מבטלת אותה —
# אבל **רק ב-PR**: על main כל ריצה היא הרשומה של מיזוג, ואין לבטל אותה.
concurrency:
  # על push ל-main ה-SHA נכנס לשם הקבוצה, אחרת GitHub מרשה
  # ריצה ממתינה אחת בלבד וכל דחיפה חדשה דוחקת את קודמתה. זה
  # תוקן ב-#236 ב-tests.yml בלבד; כאן זה נמדד על הסורקים.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Version
        run: shellcheck --version

      # הגזירה עצמה. שני פלטים:
      #   $RUNNER_TEMP/agent — נתיב לשורה, כולם `sh`
      #   $RUNNER_TEMP/rest  — "<ניב> <נתיב>" לשורה
      - name: Collect shell files from the tree
        run: |
          set -euo pipefail
          find . -name .git -prune -o \
                 -type f -name '*.sh' -print \
            | sed 's|^\./||' > "$RUNNER_TEMP/all"
          # שתי נקודות הכניסה של הסוכן אינן נושאות סיומת `.sh`.
          for extra in agent/imagesrv-agent agent/init; do
            if [ -f "$extra" ]; then echo "$extra" >> "$RUNNER_TEMP/all"; fi
          done
          LC_ALL=C sort -o "$RUNNER_TEMP/all" "$RUNNER_TEMP/all"

          : > "$RUNNER_TEMP/agent"
          : > "$RUNNER_TEMP/rest"
          while IFS= read -r f; do
            case "$f" in
              # קבצי הסוכן: הניב **מוצהר** ולא נגזר, כי `agent/lib/*.sh`
              # נטענים ב-`.` ואין להם shebang. זו ההצהרה היחידה שנשארה,
              # והם גם הקבוצה היחידה שיש לה החרגות מנומקות.
              agent/lib/*.sh|agent/imagesrv-agent|agent/init)
                echo "$f" >> "$RUNNER_TEMP/agent" ;;
              # לכל השאר הניב נגזר מה-shebang. הניסיון הראשון (#247)
              # פיצל לפי ניחוש, וה-CI נפל על bashisms שהוצהרו כ-POSIX.
              #
              # קריאה שנכשלה **אינה** נופלת ל-`sh`: הנוסח הקודם
              # (`head -1 "$f" | grep -q bash`) החזיר "לא bash" גם
              # כשהקובץ לא היה קריא בכלל, כלומר ניחוש שמתחזה לגזירה.
              *)
                if ! first=$(head -n 1 "$f"); then
                  echo "::error::אין קריאה של השורה הראשונה של $f — הניב אינו נגזר"
                  exit 1
                fi
                case "$first" in *bash*) sh=bash ;; *) sh=sh ;; esac
                echo "$sh $f" >> "$RUNNER_TEMP/rest" ;;
            esac
          done < "$RUNNER_TEMP/all"

          n=$(wc -l < "$RUNNER_TEMP/all")
          echo "נגזרו $n קובצי מעטפת מהעץ:"
          cat -n "$RUNNER_TEMP/all"
          # גזירה שנשברה מחזירה רשימה ריקה, וסריקה של כלום עוברת.
          # רצפה מפורשת הופכת את זה לאדום במקום לירוק (עיקרון 5).
          # הרצפה נקבעת לפי הריפו הציבורי הרזה (25 קבצים אחרי שהפרסום
          # מוציא 13), לא לפי הפרטי (38).
          if [ "$n" -lt 20 ]; then
            echo "::error::הגזירה החזירה $n קבצים בלבד — היא נשברה."
            exit 1
          fi

      - name: Agent (POSIX sh) — blocking
        run: |
          set -euo pipefail
          xargs -r shellcheck -s sh --severity=warning \
            --exclude=SC1090,SC2034,SC2154 < "$RUNNER_TEMP/agent"

      # כל השאר, כל קובץ בניב שנגזר לו. הלולאה אינה עוצרת בכשל הראשון:
      # דוח חלקי היה שולח לסבב תיקונים אחד לכל קובץ.
      - name: Everything else (dialect from the shebang) — blocking
        run: |
          set -euo pipefail
          rc=0
          while read -r sh f; do
            echo "== $f ($sh)"
            shellcheck -s "$sh" --severity=warning "$f" || rc=1
          done < "$RUNNER_TEMP/rest"
          exit "$rc"

      # דיווח בלבד: `note` הוא סגנון ורמיזות, ואדום ב-CI שמור לכשל
      # אמיתי כדי שאדום יישאר משמעותי (אותה מדיניות כמו ב-codeql.yml).
      # הדוח המלא נכתב לסיכום הריצה ולא רק ללוג: ממצא ברמת `note`
      # שקבור באלף שורות הוא ממצא שאיש לא יקרא.
      - name: Full report (notes included, non-blocking)
        if: always()
        run: |
          {
            echo "## ShellCheck — הדוח המלא"
            echo
            echo '```'
            xargs -r shellcheck -s sh --severity=style -f gcc \
              < "$RUNNER_TEMP/agent" || true
            while read -r sh f; do
              shellcheck -s "$sh" --severity=style -f gcc "$f" || true
            done < "$RUNNER_TEMP/rest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
