# ImageSrv USB -- #2186. Legacy BIOS: built into core.img (grub-mkimage -c, tools/build_usb_clone.sh).
# It finds the boot partition of the stick by its label and points prefix at the directory
# the signed UEFI GRUB reads; normal mode then reads grub.cfg there, so BIOS and UEFI boot
# one kernel line. Nothing of ours on a kernel line here (principle 2). No stick found:
# GRUB says no such device and stops at its prompt.
# NO QUOTE MARKS in these comments: an unpaired one made GRUB read on past the end of the
# comment, and the stick stopped at the grub prompt (QEMU, 25/10). The test guards it.
search --no-floppy --label IMGSRV_USB --set=root
set prefix=($root)/EFI/debian
