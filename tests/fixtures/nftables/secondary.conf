#!/usr/sbin/nft -f
# ImageSrv — נוצר על ידי deploy/nftables-rules.sh. אל תערוך ביד.
# מדיניות לפי וילן (R20 §4 / #1074): input drop, output accept, forward drop.
# פורטים 77xx (#3871): הסוכן, Trident, בין-שרתים, והקונסולה ב-443.
# Agent API requires TLS (#3580)
# /boot במאזין משלו (#3486): תפריט האתחול, הקרנל וה-initrd על BOOT_PORT, לא על פורט הסוכן.
# השרת אינו נתב — forward סגור כדי שכרטיס הפצה לא יהפוך לגשר לכיתות.

flush ruleset

table inet imagesrv {
	# המחשבים הרשומים (נדב 14/11, #1079/#2485): השרת ממלא, מהקובץ שבסוף (known_fw.py).
	set known_macs {
		type ether_addr
	}

	chain input {
		type filter hook input priority filter; policy drop;

		# loopback — pairing מקומי, קונסולה על 127.0.0.1, health עצמי.
		iifname "lo" accept

		# תשובות לחיבורים שאנחנו יזמנו, וחיבורים related (TFTP helper אם נטען).
		ct state established,related accept
		ct state invalid drop

		# ICMP/ICMPv6: echo לאבחון, ND ל-IPv6, ו-PMTU כדי ש-TCP לא ייחסם.
		icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } accept
		icmpv6 type { echo-request, echo-reply, destination-unreachable, packet-too-big, time-exceeded, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

		# --- וילן ההפצה (eth-deploy) ---
		# DHCP: מקור ראשוני עשוי להיות 0.0.0.0 — לא דורשים כתובת קיימת.
		iifname "eth-deploy" udp dport 67 accept
		# TFTP: קריאת shim/GRUB. העברת הנתונים היא related אם nf_conntrack_tftp טעון.
		iifname "eth-deploy" udp dport 69 accept
		# סוכן (hello/images) — HTTP על כרטיס ההפצה בלבד. מחשב לא רשום מקבל ממנו 403 (חוץ מ-hello).
		iifname "eth-deploy" tcp dport 7712 accept
		# GRUB/boot (#3486): תפריט, קרנל ו-initrd, במאזין משלו. פתוח למחשב לא רשום, כי רק הוא
		# מחליט שם בין הדיסק המקומי למסך "לא רשום" (#1802).
		iifname "eth-deploy" tcp dport 7711 accept
		# מולטיקאסט: מנוע החתיכות portbase+2 ומשוב הקצב (feedback) שלו portbase+3 (ברירת מחדל 7713-7714, #3512, #3871).
		# ‏portbase ו-portbase+1 אינם נפתחים עוד: המנוע הישן שהשתמש בהם הוסר (#3173).
		# נדב 14/11 (#2485): רק ממחשב רשום -- ה-MAC שלו בקבוצה known_macs, שהשרת כותב בכל שינוי
		# ברשימת המכונות (server/net/known_fw.py). מחשב לא רשום: שורת יומן מרוסנת, ו-drop.
		# DHCP/TFTP/סוכן נשארים פתוחים לכולם: מחשב לא רשום מקבל מהם רק את הדרך לדיסק המקומי
		# או למסך "לא רשום" (#1802); שער ה-HTTP של הסוכן סוגר את השאר (server/agent/deploy_gate.py).
		iifname "eth-deploy" udp dport 7713-7714 ether saddr @known_macs accept
		iifname "eth-deploy" udp dport 7713-7714 limit rate 5/minute log prefix "imagesrv-unregistered " level info
		iifname "eth-deploy" udp dport 7713-7714 drop
		# IGMP (#1972): השרת הוא ה-querier, ושומע querier אחר לפי השאילתות שלו.
		iifname "eth-deploy" ip protocol igmp accept
		# WoL (UDP 9) הוא יוצא — chain output ב-accept, אין כלל כניסה.

		# --- וילן השרתים (eth-srv) ---
		# קונסולה HTTPS — לא על כרטיס ההפצה.
		iifname "eth-srv" tcp dport 443 accept
		# משני בלבד: 7700 נכנס רק מוילן השרתים ורק מכתובת הראשי.
		# הראשי יוזם; תשובות הן established. mTLS עדיין חובה מעל זה.
		iifname "eth-srv" ip saddr 10.10.10.8 tcp dport 7700 accept

		# כל השאר: יומן מצומצם ואז drop (ה-policy). כיתות = v2, לא נפתח כאן.
		# ‏level info: לא warning — אחרת השורה מודפסת על הקונסולה מעל ה-DCUI (#1195)
		log prefix "imagesrv-drop " level info limit rate 5/minute
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}

# הרשימה שהשרת כותב (server/net/known_fw.py) -- כל טעינה של הקובץ הזה ממלאת את
# known_macs מחדש. תבנית שאינה תואמת אף קובץ (התקנה טרייה) אינה שגיאה.
include "/etc/imagesrv/nft.d/*.nft"
